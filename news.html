<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haberler | Adil Yılmayan Yayınları</title>
  <meta name="description" content="Yazarın etkinlik, röportaj ve yeni kitap duyurularını takip edin.">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/public.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="site-header"></header>

  <main class="container">
    <div class="about-header scroll-trigger">
      <h1>Haberler & Duyurular</h1>
      <p style="color: var(--text-secondary); max-width:600px; margin:0 auto;">Yeni kitaplar, röportajlar, konferanslar ve imza günleri hakkında en güncel haberler.</p>
    </div>

    <!-- Layout Grid: Main Feed -->
    <div style="margin-top:2rem;">
      <section>
        <div class="articles-grid" id="news-catalog-feed" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 3rem;">
          <!-- Loaded via news.js -->
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
