<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haber & Etkinlik Yönetimi | Yönetici Paneli</title>
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="admin-wrapper" id="news-deck-wrapper">
    <!-- Sidebar -->
    
    <main class="admin-main">
      <!-- Header -->
      
      <div class="admin-content">
        
        <div class="action-bar">
          <h2 style="font-family:var(--font-serif); font-size:1.5rem; margin:0;">Haber & Etkinlik Yönetimi</h2>
          <button class="btn btn-primary" id="btn-create-news">+ Haber Ekle</button>
        </div>

        <!-- Master List Panel -->
        <div class="panel-card" id="news-list-panel">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Başlık</th>
                  <th>Kısa Özet</th>
                  <th>Tarih</th>
                  <th style="text-align:right;">İşlemler</th>
                </tr>
              </thead>
              <tbody id="news-table-body">
                <!-- Loaded dynamically -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Compose / Edit Panel Form -->
        <div class="panel-card" id="news-compose-panel" style="display:none; padding:2.5rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; border-bottom:1px solid var(--border-color); padding-bottom:1rem;">
            <h2 id="news-compose-title" style="font-family:var(--font-serif);">Haber Yapılandır</h2>
            <button class="btn btn-secondary btn-sm" id="btn-cancel-news-compose">&larr; Listeye Dön</button>
          </div>

          <form id="news-form">
            <input type="hidden" id="edit-news-id">

            <div class="form-row-2">
              <div class="form-group">
                <label class="form-label" for="news-title-input">Haber Başlığı *</label>
                <input type="text" id="news-title-input" class="form-control" placeholder="örn. Yeni Kitap Çıktı" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="news-date-input">Görünen Tarih *</label>
                <input type="text" id="news-date-input" class="form-control" placeholder="örn. 15 Ekim 2026" required>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="news-summary-input">Kısa Özet *</label>
              <textarea id="news-summary-input" class="form-control" rows="2" placeholder="Listede görünecek özet..." required></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="news-content-input">Haber İçeriği *</label>
              <textarea id="news-content-input" class="form-control" rows="6" placeholder="Haberin tam metni..." required></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="news-cover-url">Kapak Görseli URL (Opsiyonel)</label>
              <input type="text" id="news-cover-url" class="form-control" placeholder="https://...">
            </div>

            <!-- Submission Actions -->
            <div style="display:flex; justify-content:flex-end; gap:1rem; margin-top:2rem; border-top:1px solid var(--border-color); padding-top:1.5rem;">
              <button type="button" class="btn btn-secondary" id="btn-cancel-news-compose-2">İptal</button>
              <button type="submit" class="btn btn-primary">Haberi Kaydet</button>
            </div>

          </form>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/news-dashboard.js"></script>
</body>
</html>
