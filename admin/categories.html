<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management | Admin Console</title>
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body class="admin-body">

  <div class="admin-wrapper" id="categories-deck-wrapper">
    <!-- Sidebar -->
    
    <main class="admin-main">
      <!-- Header -->
      
      <div class="admin-content" style="display:grid; grid-template-columns: 2fr 1fr; gap:2.5rem; align-items: flex-start;">
        
        <!-- Table Column -->
        <div class="panel-card" style="padding: 2rem;">
          <h2 style="font-family:var(--font-serif); margin-bottom:1.5rem; font-size:1.5rem;">Kategoriler Endeksi</h2>
          <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.5rem;">Sıralama önceliği, konuların kamuya açık kataloglarda nasıl görüneceğini belirler.</p>
          <div class="data-table-wrapper" style="border:none; margin:0;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Konu Adı</th>
                  <th>Slug Anahtarı</th>
                  <th>Sıralama Önceliği</th>
                  <th style="text-align:right;">İşlemler</th>
                </tr>
              </thead>
              <tbody id="categories-table-body">
                <!-- Loaded dynamically -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Add / Edit Column -->
        <div class="panel-card" style="padding: 2rem;">
          <h3 id="category-panel-title" style="font-family:var(--font-serif); margin-bottom:1.5rem; font-size:1.3rem;">Kategori Oluştur</h3>
          <form id="category-form">
            <input type="hidden" id="edit-category-id">
            
            <div class="form-group">
              <label class="form-label" for="category-name-input">Kategori Adı *</label>
              <input type="text" id="category-name-input" class="form-control" placeholder="örn. Bizans Tarihi" required>
            </div>
            
            <div class="form-group">
              <label class="form-label" for="category-slug-input">Slug Anahtarı (Boş bırakılırsa otomatik oluşturulur)</label>
              <input type="text" id="category-slug-input" class="form-control" placeholder="bizans-tarihi">
            </div>

            <div class="form-group">
              <label class="form-label" for="category-order-input">Sıralama Önceliği İndeksi</label>
              <input type="number" id="category-order-input" class="form-control" value="0" min="0">
            </div>

            <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:2rem;">
              <button type="button" class="btn btn-secondary" id="btn-clear-category" style="display:none;">Temizle</button>
              <button type="submit" class="btn btn-primary" id="btn-save-category">Kaydet</button>
            </div>
          </form>
        </div>

      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/categories-dashboard.js"></script>
</body>
</html>
