<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazılar | Adil Yılmayan Yayınları</title>
  <meta name="description" content="Kuantum mekaniği, Bizans tarihi, bilim, edebiyat ve dijital yayıncılık üzerine deneme ve makaleleri okuyun.">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/public.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="site-header"></header>

  <main class="container">
    <div class="about-header scroll-trigger">
      <h1>Makaleler & Denemeler</h1>
      <p style="color: var(--text-secondary); max-width:600px; margin:0 auto;">Tarih, fizik, edebiyat ve yayıncılık üzerine yazıları filtreleyin veya arama yapın.</p>
    </div>

    <!-- Category Filter Bar and Inline Search Box -->
    <div class="filter-bar scroll-trigger">
      <ul class="categories-list" id="category-filter-list">
        <li><a href="#" class="active" data-id="all">Tüm Konular</a></li>
        <!-- Dynamically populated categories -->
      </ul>

      <!-- Filter/Search within page -->
      <div class="search-box-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="article-catalog-search" placeholder="Yazılarda ara...">
      </div>
    </div>

    <!-- Layout Grid: Main Feed and Featured Sidebar -->
    <div style="display:grid; grid-template-columns: 1.3fr 0.7fr; gap: 3rem; margin-top:2rem;">
      
      <!-- List Feed -->
      <section>
        <div class="articles-grid" id="articles-catalog-feed" style="grid-template-columns: 1fr;">
          <!-- Loaded via articles.js -->
        </div>

        <!-- Pagination Controls -->
        <div class="pagination" id="pagination-controls">
          <!-- Populated via index selector -->
        </div>
      </section>

      <!-- Featured Sidebar Column -->
      <aside class="scroll-trigger" style="position:sticky; top: 100px; height: fit-content;">
        <h3 style="font-family:var(--font-serif); margin-bottom:1.5rem; border-bottom:1px solid var(--border-color); padding-bottom: 0.5rem;">Popüler Yazılar</h3>
        <div style="display:flex; flex-direction:column; gap:1.5rem;" id="popular-articles-sidebar">
          <!-- Injected via catalog pages -->
        </div>
      </aside>

    </div>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
