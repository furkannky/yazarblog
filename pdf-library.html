<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Kütüphanesi | Adil Yılmayan Araştırma Yazıları</title>
  <meta name="description" content="Adil Yılmayan tarafından yayınlanan araştırma yazılarını, klasik çevirileri ve fizik incelemelerini indirin.">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/public.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,650;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header"></header>

  <main class="container">
    <div class="about-header scroll-trigger">
      <h1>PDF Araştırma Kütüphanesi</h1>
      <p style="color: var(--text-secondary); max-width:600px; margin:0 auto;">Kitap eklerini, bilimsel özetleri ve kaynak analiz notlarını inceleyin ve indirin.</p>
    </div>

    <!-- Filters and inline search bar -->
    <div class="filter-bar scroll-trigger">
      <ul class="categories-list" id="pdf-category-toggles">
        <li><a href="#" class="active" data-id="all">Tüm Dosyalar</a></li>
        <!-- Dynamically loaded categories -->
      </ul>

      <div class="search-box-container">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="pdf-search-bar" placeholder="Dosyalarda ara...">
      </div>
    </div>

    <!-- PDF File Cards Grid layout -->
    <section class="pdf-grid scroll-trigger" id="pdf-catalogue-root" style="margin-bottom: 5rem;">
      <!-- Loaded dynamically via pdfs.js -->
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
