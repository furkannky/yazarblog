<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yazı Detayı | A. Author Yayınları</title>
  <meta name="description" content="Makalenin tam metnini okuyun, yorumları inceleyin veya düşüncelerinizi paylaşın.">
  <link rel="stylesheet" href="/css/index.css">
  <link rel="stylesheet" href="/css/public.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,650;1,400&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header"></header>

  <main class="container-narrow">
    <article class="scroll-trigger">
      
      <!-- Article Header details -->
      <header class="article-header">
        <span class="article-category-badge" id="article-view-category">Konu</span>
        <h1 class="article-title" id="article-view-title">Makale Başlığı</h1>
        
        <!-- Meta Details row -->
        <div class="article-meta-info">
          <div class="article-author-info">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100' height='100' fill='%234a5568'/><circle cx='50' cy='35' r='20' fill='%23cbd5e0'/><path d='M20 80c0-15 15-20 30-20s30 5 30 20z' fill='%23cbd5e0'/></svg>" alt="Yazar avatarı" class="article-author-avatar" id="article-author-avatar-img">
            <span>A. Author tarafından</span>
          </div>
          <span>•</span>
          <span id="article-view-date">6 Ağustos 2026</span>
          <span>•</span>
          <span id="article-view-reading-time">3 dk okuma</span>
          <span>•</span>
          <span id="article-view-counter">0 görüntülenme</span>
        </div>

        <!-- Social Share buttons -->
        <div style="display:flex; justify-content:center; gap: 0.5rem; margin-bottom:1.5rem;">
          <button id="share-btn-twitter" class="share-btn" title="Twitter'da Paylaş">🐦</button>
          <button id="share-btn-facebook" class="share-btn" title="Facebook'ta Paylaş">👤</button>
          <button id="share-btn-link" class="share-btn" title="Bağlantıyı Kopyala">🔗</button>
        </div>
      </header>

      <!-- Featured Cover Wrap -->
      <div class="article-cover-img-wrapper">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='800' height='450' viewBox='0 0 800 450'><rect width='100%' height='100%' fill='%232d3748'/></svg>" alt="Öne Çıkan Görsel" id="article-view-cover-img">
      </div>

      <!-- Main Rich Content Body -->
      <div class="article-body-content" id="article-view-body-root">
        <!-- Content gets loaded here -->
      </div>

      <!-- Tag listing tags -->
      <div class="article-tags" id="article-view-tags-root">
        <!-- Dynamic tags -->
      </div>
    </article>

    <!-- Related Articles -->
    <section class="scroll-trigger" style="margin-top:4rem; border-top:1px solid var(--border-color); padding-top:3rem;">
      <h3 style="font-family:var(--font-serif); font-size:1.5rem; margin-bottom: 2rem;">Sıradaki Yazı</h3>
      <div class="articles-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));" id="related-articles-root">
        <!-- Rendered via article.js -->
      </div>
    </section>

    <!-- Comments Moderated queue -->
    <section class="comments-section scroll-trigger">
      <h3 class="comment-box-title">Yorumlar (<span id="comments-count-badge">0</span>)</h3>
      <ul class="comments-list" id="comments-timeline-list">
        <!-- Loader element or items -->
      </ul>

      <!-- Leave comment form -->
      <div class="comment-form">
        <h4 style="margin-bottom:1.25rem; font-family:var(--font-serif); font-size:1.2rem;">Bir Yorum Yazın</h4>
        <p style="font-size:0.85rem; color:var(--text-tertiary); margin-bottom:1.5rem;">E-posta adresiniz yayınlanmayacaktır. Gerekli alanlar * ile işaretlenmiştir.</p>
        
        <form id="article-comment-submit-form">
          <div class="form-group">
            <label class="form-label" for="comment-author-name">İsim *</label>
            <input type="text" id="comment-author-name" class="form-control" placeholder="Adınız" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="comment-author-email">E-posta *</label>
            <input type="email" id="comment-author-email" class="form-control" placeholder="adiniz@eposta.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="comment-message-body">Yorum *</label>
            <textarea id="comment-message-body" class="form-control" rows="5" placeholder="Düşüncelerinizi paylaşın..." required></textarea>
          </div>
          <!-- Simple Spam Protection Challenge -->
          <div class="form-group">
            <label class="form-label" for="comment-spam-challenge">Spam Koruması: 5 + 3 kaçtır? *</label>
            <input type="number" id="comment-spam-challenge" class="form-control" placeholder="Sonucu girin" required>
          </div>
          <button type="submit" class="btn btn-primary">Yorum Gönder</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
